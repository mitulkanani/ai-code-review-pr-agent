services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/reviews.db
      REVIEW_PROVIDER: ${REVIEW_PROVIDER:-rules}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      API_KEY: ${API_KEY:-}
    volumes:
      - review-data:/data
    restart: unless-stopped

volumes:
  review-data:
